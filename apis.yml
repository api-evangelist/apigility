aid: apigility

name: Zend

description: 'Zend Apigility is an open-source API builder framework originally developed by Zend and now part of the Laminas project. It provides tools to create high‑quality, versioned RESTful APIs in PHP, with support for content negotiation, HAL, and API‑centric architecture. The platform includes documentation, tutorials, and a community forum to help developers build and maintain APIs efficiently.'

